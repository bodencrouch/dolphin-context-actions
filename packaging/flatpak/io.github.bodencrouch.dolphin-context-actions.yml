# Intentionally does not build kio-plugin/ (the Dolphin context-menu plugin
# and its KAuth privileged-link helper). That helper is a root-owned, D-Bus
# system-activated service with a polkit action -- there is no way to install
# a system D-Bus service or polkit action from inside Flatpak's sandbox. This
# manifest ships the CLI + service menus only; Link Shell Extension features
# (Pick Link Source / Drop Link As), which need the plugin, are unavailable
# under Flatpak. Use the native rpm/deb/Arch package, or install.sh, for those.
id: io.github.bodencrouch.dolphin-context-actions
runtime: org.kde.Platform
runtime-version: "6.8"
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.python3
command: dolphin-context-actions

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=home:rw
  - --share=network
  - --talk-name=org.kde.kdialog
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: ffmpeg
    buildsystem: simple
    build-commands:
      - apt-get update && apt-get install -y ffmpeg
    sources:
      - type: archive
        url: https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
        sha256: ""
        only-arches:
          - x86_64

  - name: dolphin-context-actions
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app .
      - install -Dm644 servicemenus/dolphin-context-actions.desktop
        /app/share/kio/servicemenus/dolphin-context-actions.desktop
      - install -Dm644 servicemenus/dolphin-audio-converter.desktop
        /app/share/kio/servicemenus/dolphin-audio-converter.desktop
    sources:
      - type: git
        url: https://github.com/bodencrouch/dolphin-context-actions.git
        tag: v1.0.0
