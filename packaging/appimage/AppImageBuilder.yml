# Intentionally does not build kio-plugin/ (the Dolphin context-menu plugin
# and its KAuth privileged-link helper). AppImage is a relocatable, unprivileged
# user bundle with no root-owned install step, so it cannot host a root-owned
# D-Bus system service or polkit action. This bundle ships the CLI only; Link
# Shell Extension features (Pick Link Source / Drop Link As), which need the
# plugin registered with Dolphin/KIO, are unavailable from an AppImage. Use the
# native rpm/deb/Arch package, or install.sh, for those.
version: 1
AppDir:
  app_info:
    id: io.github.bodencrouch.dolphin-context-actions
    name: dolphin-context-actions
    version: "0.1.0"
    exec: usr/bin/dolphin-context-actions
    icon: document-convert

  apt:
    arch: amd64
    sources:
      - sourceline: "deb http://archive.ubuntu.com/ubuntu noble main universe"
    include:
      - python3
      - python3-pip
      - ffmpeg
      - kdialog
      - libnotify-bin

  files:
    include: []
    exclude:
      - usr/share/man
      - usr/share/doc
      - usr/share/locale

  runtime:
    env:
      PATH: '${APPDIR}/usr/bin:${PATH}'
      PIP_REQUIRE_VIRTUALENV: 'false'

  test:
    ubuntu:
      image: appimagecrafters/appimage-builder:latest
      command: /AppDir/usr/bin/dolphin-context-actions --help

AppImage:
  update-information: None
  sign-key: None
  arch: x86_64
