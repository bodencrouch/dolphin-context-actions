# Intentionally does not build kio-plugin/ (the Dolphin context-menu plugin
# and its KAuth privileged-link helper). That helper is a root-owned, D-Bus
# system-activated service with a polkit action -- strict confinement has no
# path to install a system D-Bus service or polkit action. This snap ships the
# CLI + service menus only; Link Shell Extension features (Pick Link Source /
# Drop Link As), which need the plugin, are unavailable under Snap. As of
# this writing none of the rpm/deb/Arch packages build kio-plugin/ either --
# only install.sh / make install (from a source checkout) do.
name: dolphin-context-actions
base: core24
version: "0.1.0"
summary: Media conversion and file-linking actions for Dolphin's context menu
description: |
  Adds intelligent right-click actions to Dolphin (KDE file manager) for
  converting media files. The menu adapts to file type — right-click a GIF
  to convert it to MP4 or upload to Imgur; right-click a video to convert
  to GIF with quality presets; right-click an audio file to transcode to
  any of 7 formats (MP3, OGG, FLAC, WAV, M4A, Opus, ALAC).

grade: stable
confinement: strict

parts:
  dolphin-context-actions:
    plugin: python
    source: https://github.com/bodencrouch/dolphin-context-actions.git
    source-tag: v0.1.0
    python-packages: []
    build-packages:
      - ffmpeg
    stage-packages:
      - ffmpeg
      - kdialog
      - libnotify-bin

apps:
  dolphin-context-actions:
    command: bin/dolphin-context-actions
    plugs:
      - home
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - removable-media
      - network

slots:
  dolphin-servicemenu:
    interface: content
    target: $SNAP_USER_DATA/.local/share/kio/servicemenus
    read:
      - $SNAP/usr/share/kio/servicemenus
