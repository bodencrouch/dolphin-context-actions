[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dolphin-context-actions"
version = "0.1.0"
description = "File conversion and link actions for Dolphin's context menu"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["dolphin", "kde", "service-menu", "ffmpeg", "converter", "gif", "audio", "imgur"]

authors = [
  {name = "Brunner56"},
]

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
  "Topic :: Multimedia :: Sound/Audio :: Conversion",
  "Topic :: Multimedia :: Video :: Conversion",
]

dependencies = ["PyYAML>=6"]

[project.urls]
Homepage = "https://github.com/bodencrouch/dolphin-context-actions"
Repository = "https://github.com/bodencrouch/dolphin-context-actions"
Issues = "https://github.com/bodencrouch/dolphin-context-actions/issues"

[project.scripts]
dolphin-context-actions = "dolphin_context_actions.cli:main"
dolphin-context-actions-generate-menus = "dolphin_context_actions.file_converter_menus:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dolphin_context_actions = ["py.typed", "conversions.yaml"]
