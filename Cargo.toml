[package]
name = "dolphin-context-actions"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "File conversion and link actions for Dolphin's context menu"
authors = ["Brunner56"]
repository = "https://github.com/bodencrouch/dolphin-context-actions"
readme = "README.md"
keywords = ["dolphin", "kde", "ffmpeg", "converter"]
categories = ["command-line-utilities"]
default-run = "dolphin-context-actions"

[[bin]]
name = "dolphin-context-actions"
path = "src/main.rs"

[[bin]]
name = "dolphin-context-actions-generate-menus"
path = "src/bin/generate_menus.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
csv = "1"
dirs = "6"
mime_guess = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
tempfile = "3"
toml = "0.8"
ureq = { version = "2", features = ["json"] }
walkdir = "2"
which = "7"
