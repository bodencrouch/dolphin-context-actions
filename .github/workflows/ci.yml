name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime tools the tests exercise
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run tests
        run: python -m pytest tests/ -q

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
      - name: Lint every shell script
        run: |
          shellcheck install.sh ghns/install.sh scripts/*.sh tests/*.sh

  ghns-package:
    name: Download-New-Services package (sandboxed install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build and runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg shellcheck
          python -m pip install PyYAML
      - name: Build, install into a throwaway HOME, exercise, uninstall
        run: tests/test_ghns_package.sh
      - name: Build the release-shaped package
        run: scripts/build-ghns-package.sh dist
      - name: Keep the built package as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghns-package
          path: dist/dolphin-context-actions-servicemenu-v*.tar.gz
          if-no-files-found: ignore

  kio-plugin:
    name: KIO plugin (KF6, Fedora)
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install KDE Frameworks 6 build stack
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            cmake make gcc-c++ \
            extra-cmake-modules qt6-qtbase-devel \
            kf6-kio-devel kf6-kauth-devel kf6-kcoreaddons-devel \
            appstream desktop-file-utils
      - name: Configure and build
        run: |
          cmake -S kio-plugin -B build/kio-plugin \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build/kio-plugin --parallel
      - name: Run plugin tests headless
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cd build/kio-plugin
          ctest --output-on-failure
