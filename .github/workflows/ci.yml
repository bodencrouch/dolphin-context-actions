name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helper-tests:
    name: C++ helper tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6 and runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ qt6-base-dev ffmpeg p7zip-full
      - name: Configure and test
        env:
          DOLPHIN_CONTEXT_ACTIONS_HEADLESS: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake -S . -B build/helper -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          cmake --build build/helper --parallel
          ctest --test-dir build/helper --output-on-failure

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
      - name: Lint every shell script
        run: |
          shellcheck install.sh ghns/install.sh scripts/*.sh tests/*.sh

  ghns-package:
    name: Download-New-Services package (sandboxed install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build and runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ qt6-base-dev ffmpeg shellcheck
      - name: Build, install into a throwaway HOME, exercise, uninstall
        run: tests/test_ghns_package.sh
      - name: Build the release-shaped packages
        run: |
          scripts/build-ghns-package.sh context-actions dist
          scripts/build-ghns-package.sh archive dist
          scripts/build-ghns-package.sh link dist
      - name: Require three GHNS tarballs
        run: |
          ls dist/dolphin-context-actions-servicemenu-v*.tar.gz
          ls dist/dolphin-archive-servicemenu-v*.tar.gz
          ls dist/dolphin-link-servicemenu-v*.tar.gz
      - name: Pling metadata
        run: tests/test_pling_metadata.sh
      - name: Keep the built packages as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghns-package
          path: dist/dolphin-*-servicemenu-v*.tar.gz
          if-no-files-found: error

  kio-plugin:
    name: KIO plugin (KF6, Fedora)
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install KDE Frameworks 6 build stack
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            cmake make gcc-c++ \
            extra-cmake-modules qt6-qtbase-devel \
            kf6-kio-devel kf6-kauth-devel kf6-kcoreaddons-devel \
            appstream desktop-file-utils
      - name: Configure and build
        run: |
          cmake -S kio-plugin -B build/kio-plugin \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build/kio-plugin --parallel
      - name: Run plugin tests headless
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cd build/kio-plugin
          ctest --output-on-failure
