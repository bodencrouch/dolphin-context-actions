name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release-assets:
    name: Attach the Download-New-Services package
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          python -m pip install PyYAML build
      - name: Build the GHNS package and the Python distributions
        run: |
          scripts/build-ghns-package.sh dist
          python -m build --outdir dist
      - name: Upload assets to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            dist/dolphin-context-actions-servicemenu-v*.tar.gz \
            dist/*.whl dist/*.tar.gz \
            --clobber --repo "${{ github.repository }}"

  publish-store:
    name: Publish payload to store.kde.org
    needs: [release-please, release-assets]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the GHNS package
        run: |
          python -m pip install PyYAML
          scripts/build-ghns-package.sh dist
      - name: Push new payload to the store product (OCS API)
        env:
          PLING_USERNAME: ${{ secrets.PLING_USERNAME }}
          PLING_PASSWORD: ${{ secrets.PLING_PASSWORD }}
          PLING_CONTENT_ID: ${{ secrets.PLING_CONTENT_ID }}
        run: |
          if [ -z "$PLING_USERNAME" ] || [ -z "$PLING_PASSWORD" ] || [ -z "$PLING_CONTENT_ID" ]; then
            echo "::notice::PLING_USERNAME / PLING_PASSWORD / PLING_CONTENT_ID secrets not set."
            echo "::notice::Skipping store.kde.org publish. See packaging/pling/PUBLISHING.md."
            exit 0
          fi
          scripts/publish-to-pling.sh dist/dolphin-context-actions-servicemenu-v*.tar.gz
